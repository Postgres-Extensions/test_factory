name: CI
on: [push, pull_request]
jobs:
  # Style linter (https://github.com/Postgres-Extensions/linter, vendored at
  # .vendor/linter). Deliberately checked out WITHOUT submodules -- `make
  # lint` is the same command a developer runs locally, and lint.mk
  # self-initializes the submodule on first use (see its comment). Using the
  # exact same entry point here is what actually proves that self-init works,
  # rather than papering over it with a submodules: true checkout. The
  # linter's own test suite (fixtures + scanner edge cases) is that repo's
  # own CI's job, not this one's. No PostgreSQL needed -- sql-lint is a
  # standalone Perl script -- so this doesn't use the pgxn-tools container.
  lint:
    name: 🧹 SQL Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Lint SQL
        run: make lint

  test:
    strategy:
      matrix:
        pg: [17, 16, 15, 14, 13, 12, 11, 10]
    name: 🐘 PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    container: pgxn/pgxn-tools
    steps:
      - name: Start PostgreSQL ${{ matrix.pg }}
        run: pg-start ${{ matrix.pg }}
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Test on PostgreSQL ${{ matrix.pg }}
        run: pg-build-test
      # pg-build-test (from pgxn-tools) runs `make all; sudo make install;
      # make installcheck` -- it never invokes the `test` target, so
      # pgxntool's test-build feature (wired only into `test`'s dependency
      # chain, not `installcheck`) would otherwise never run in CI even
      # though `PGXNTOOL_ENABLE_TEST_BUILD = yes` is set in the Makefile.
      # Run it explicitly here so a SQL syntax error or a packaging/install
      # regression actually fails CI, instead of only being caught by a
      # developer who happens to run `make test` locally.
      - name: Verify test/build (SQL syntax + install mechanics)
        # pgxntool/run-test-build.sh (vendored, not this repo's own script)
        # shells out to rsync to sync test/build/*.sql into test/build/sql/ --
        # the pgxn/pgxn-tools image doesn't ship rsync, so install it first.
        # Any pgxntool project enabling PGXNTOOL_ENABLE_TEST_BUILD on this
        # image would hit the same gap; worth a pgxntool-test issue, not
        # something to work around inside the vendored script itself.
        run: |
          apt-get install -y rsync
          make test-build
