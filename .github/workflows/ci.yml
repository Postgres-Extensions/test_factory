name: CI
on: [push, pull_request]
jobs:
  # Style linter (https://github.com/Postgres-Extensions/linter, vendored at
  # .vendor/linter). Deliberately checked out WITHOUT submodules -- `make
  # lint` is the same command a developer runs locally, and lint.mk
  # self-initializes the submodule on first use (see its comment). Using the
  # exact same entry point here is what actually proves that self-init works,
  # rather than papering over it with a submodules: true checkout. The
  # linter's own test suite (fixtures + scanner edge cases) is that repo's
  # own CI's job, not this one's. No PostgreSQL needed -- sql-lint is a
  # standalone Perl script -- so this doesn't use the pgxn-tools container.
  lint:
    name: 🧹 SQL Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Lint SQL
        run: make lint

  test:
    strategy:
      matrix:
        pg: [17, 16, 15, 14, 13, 12, 11, 10]
    name: 🐘 PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    container: pgxn/pgxn-tools
    steps:
      - name: Start PostgreSQL ${{ matrix.pg }}
        run: pg-start ${{ matrix.pg }}
      - name: Check out the repo
        uses: actions/checkout@v4
      # Not `pg-build-test`, the helper script baked into this job's own
      # CONTAINER IMAGE (pgxn/pgxn-tools, github.com/pgxn/docker-pgxn-tools --
      # a completely different project from pgxntool, the Make-based build
      # system this repo vendors at pgxntool/ and invokes below): confirmed
      # from pg-build-test's actual source that it never invokes `make test`
      # (it runs `make all; sudo make install; make installcheck` directly),
      # so it would never reach test-build (wired in only via pgxntool's own
      # `test` dependency chain). Worse, its failure detection (`make
      # installcheck || status=$?`) can never actually trip: pgxntool marks
      # `installcheck` `.IGNORE`, so `make installcheck` always exits 0
      # regardless of real regression failures (verified locally with a
      # deliberately broken test). `make verify-results` (pgxntool's own
      # target) inspects the actual TAP output instead of trusting an exit
      # code, and pulls in test-build as part of the same `test` dependency
      # chain it already runs.
      #
      # rsync first: pgxntool/run-test-build.sh (vendored from pgxntool, not
      # this repo's own script) needs it to sync test/build/*.sql into
      # test/build/sql/, and the pgxn-tools CONTAINER IMAGE doesn't ship it.
      # Any pgxntool project enabling PGXNTOOL_ENABLE_TEST_BUILD on this same
      # image would hit the same gap -- worth a pgxntool-test issue, not a
      # vendored-script edit here.
      - name: Install rsync
        run: apt-get install -y rsync
      # No separate `make install` step needed here: pgxntool 2.3.0 makes
      # `installcheck: install` a real Make dependency edge (fixing the
      # ordering gap previously worked around above -- see
      # Postgres-Extensions/pgxntool-test#62 for the root cause), so
      # `verify-results`'s own dependency chain now installs the extension
      # before running the suite, every time, without a second explicit
      # invocation.
      - name: Test on PostgreSQL ${{ matrix.pg }}
        run: make verify-results
